<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="boostrap/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <title>PRACTICAS JAVASCRIPT</title>
</head>
<body>
    <nav class="navbar bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <img src="img/WIN_20260731_15_57_18_Pro.jpg" alt="Logo" width="30" height="24" class="d-inline-block align-text-top">
                TIENDITA
            </a>
        </div>
    </nav>

    <div class="container p-4 bg-inverse mt-5 card">
        <h1 class="text-center fg-black">TIENDITA</h1>
        <hr>
        <div class="d-flex justify-content-end">
            <button type="button" class="btn-solid btn-styled theme-success w-25" data-bs-toggle="dialog" data-bs-target="#addProducto">
                <i class="bi bi-plus-circle-fill"></i> Agregar
            </button>
        </div>

        <table class="table table-striped table-hover mt-3">
            <thead>
                <tr class="text-center">
                    <th>PRODUCTO</th>
                    <th>PRECIO</th>
                    <th>STOCK</th>
                    <th>ACCION</th>
                </tr>
            </thead>
            <tbody id="productos"></tbody>
        </table>
    </div>

    <dialog class="dialog" id="addProducto">
        <div class="dialog-header">
            <h1 class="dialog-title">AGREGAR PRODUCTO</h1>
            <button type="button" class="btn-close" data-bs-dismiss="dialog" aria-label="Close"></button>
        </div>
        <div class="dialog-body">
            <h3>NOMBRE</h3>
            <input type="text" id="nombre" class="form-control"><br>
            <h3>PRECIO</h3>
            <input type="number" step="0.01" min="0" id="precio" class="form-control"><br>
            <h3>STOCK</h3>
            <input type="number" step="1" min="0" id="stock" class="form-control"><br>
        </div>
        <div class="dialog-footer">
            <button type="button" class="btn-solid theme-danger" data-bs-dismiss="dialog">
                <i class="bi bi-x-circle"></i> Cancelar
            </button>
            <button type="button" class="btn-solid theme-success" id="btnSave">
                <i class="bi bi-check-circle"></i> Guardar
            </button>
        </div>
    </dialog>

    
    <dialog class="dialog" id="editProducto">
        <div class="dialog-header">
            <h1 class="dialog-title">EDITAR PRODUCTO</h1>
            <button type="button" class="btn-close" data-bs-dismiss="dialog" aria-label="Close"></button>
        </div>
        <div class="dialog-body">
            <h3>NOMBRE</h3>
            <input type="text" id="nombree" class="form-control"><br>
            <h3>PRECIO</h3>
            <input type="number" step="0.01" min="0" id="precioe" class="form-control"><br>
            <h3>STOCK</h3>
            <input type="number" step="1" min="0" id="stocke" class="form-control"><br>
        </div>
        <div class="dialog-footer">
            <input type="hidden" id="posicion">
            <button type="button" class="btn-solid theme-danger" data-bs-dismiss="dialog">
                <i class="bi bi-x-circle-fill"></i> Cancelar
            </button>
            <button type="button" class="btn-solid theme-success" id="btnUpdate">
                <i class="bi bi-check-circle"></i> Guardar
            </button>
        </div>
    </dialog>

  
    <script type="module" src="javaScript.js/bootstrap.bundle.min.js"></script>
    <script src="javaScript.js/sweetalert2.all.min.js"></script>
    <script src="tiendita.js"></script>
</body>
</html>
